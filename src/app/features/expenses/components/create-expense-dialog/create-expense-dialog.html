<h2 mat-dialog-title>Create expense</h2>

<mat-dialog-content class="expense-create-dialog h-full flex flex-1 flex-col">
  <app-expense-form
    [categories]="data.categories"
    (createExpenseEvent)="onCreateExpense($event)"
    (createExpenseCancel)="onCancel()"
    [isSubmitting]="expensesStore.creating()"
    [submissionError]="expensesStore.createError()"
  />
</mat-dialog-content>

<mat-sidenav-container class="min-h-screen bg-slate-50">
  <mat-sidenav
    mode="side"
    opened
    class="w-72 border-r border-slate-200 bg-white/90 shadow-sm backdrop-blur-sm"
  >
    <div class="flex h-full flex-col">
      <div class="flex h-16 items-center gap-3 border-b border-slate-200 px-5 py-4">
        <div
          class="flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-600 text-sm font-semibold text-white shadow-sm shadow-indigo-200"
        >
          PEM
        </div>
        <div class="min-w-0">
          <p class="text-[10px] font-semibold uppercase tracking-[0.22em] text-slate-400">
            Workspace
          </p>
          <p class="truncate text-sm font-semibold text-slate-900">Personal Expense Manager</p>
        </div>
      </div>

      <nav class="flex flex-1 flex-col gap-2 px-3 py-4" aria-label="Main navigation">
        <p class="px-3 pb-2 text-[11px] font-semibold uppercase tracking-[0.22em] text-slate-400">
          Menu
        </p>

        <a
          mat-list-item
          routerLink="/dashboard"
          routerLinkActive="selected"
          #dashboardLink="routerLinkActive"
          [attr.aria-current]="dashboardLink.isActive ? 'page' : null"
          class="group flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 transition-all duration-200 hover:bg-slate-100 hover:text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2"
        >
          <span class="flex items-center gap-2 text-left">
            <span
              aria-hidden="true"
              class="flex h-8 w-8 items-center justify-center rounded-lg bg-slate-100 text-xs font-semibold text-slate-500 transition-colors group-hover:bg-slate-200 group-hover:text-slate-700"
            >
              D
            </span>

            <span>Dashboard</span>
          </span>
        </a>

        <a
          mat-list-item
          routerLink="/expenses"
          routerLinkActive="selected"
          #expensesLink="routerLinkActive"
          [attr.aria-current]="expensesLink.isActive ? 'page' : null"
          class="group flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 transition-all duration-200 hover:bg-slate-100 hover:text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2"
        >
          <span class="flex items-center gap-2 text-left">
            <span
              aria-hidden="true"
              class="flex h-8 w-8 items-center justify-center rounded-lg bg-slate-100 text-xs font-semibold text-slate-500 transition-colors group-hover:bg-slate-200 group-hover:text-slate-700"
            >
              E
            </span>

            <span>Expenses</span>
          </span>
        </a>
        <button
          type="button"
          (click)="testUserInfo()"
          class="rounded-lg bg-indigo-600 px-4 py-2 text-white"
        >
          Test UserInfo
        </button>
        <button
          type="button"
          (click)="testConcurrentUserInfo()"
          class="rounded-lg bg-indigo-600 px-4 py-2 text-white"
        >
          Test Concurrent Requests
        </button>
        @if (authState.hasPermission(AUTH_PERMISSIONS.budgets.view)) {
          <a
            mat-list-item
            routerLink="/budgets"
            routerLinkActive="selected"
            #budgetsLink="routerLinkActive"
            [attr.aria-current]="budgetsLink.isActive ? 'page' : null"
            class="group flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 transition-all duration-200 hover:bg-slate-100 hover:text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2"
          >
            <span class="flex items-center gap-2 text-left">
              <span
                aria-hidden="true"
                class="flex h-8 w-8 items-center justify-center rounded-lg bg-slate-100 text-xs font-semibold text-slate-500 transition-colors group-hover:bg-slate-200 group-hover:text-slate-700"
              >
                B
              </span>

              <span>Budgets</span>
            </span>
          </a>
        }

        <a
          mat-list-item
          routerLink="/knowledge"
          routerLinkActive="selected"
          #knowledgeLink="routerLinkActive"
          [attr.aria-current]="knowledgeLink.isActive ? 'page' : null"
          class="group flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 transition-all duration-200 hover:bg-slate-100 hover:text-slate-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2"
        >
          <span class="flex items-center gap-2 text-left">
            <span
              aria-hidden="true"
              class="flex h-8 w-8 items-center justify-center rounded-lg bg-slate-100 text-xs font-semibold text-slate-500 transition-colors group-hover:bg-slate-200 group-hover:text-slate-700"
            >
              K
            </span>

            <span>Knowledge</span>
          </span>
        </a>
      </nav>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="min-h-screen bg-slate-50">
    <header
      class="flex h-16 items-center border-b border-slate-200 bg-slate-50 px-6 backdrop-blur-sm"
    >
      <span class="text-xl font-semibold tracking-tight text-slate-900">
        Personal Expense Manager
      </span>

      <div class="ml-auto flex items-center gap-4">
        @if (authState.user(); as user) {
          <div class="text-right">
            <p class="text-sm font-medium text-slate-900">Hello, {{ user.username }}</p>
            @if (user.email) {
              <p class="text-xs text-slate-500">
                {{ user.email }}
              </p>
            }
          </div>
        }

        <button
          type="button"
          (click)="logout()"
          class="rounded-lg bg-red-500 px-4 py-2 text-white transition duration-200 hover:bg-red-600"
        >
          Logout
        </button>
      </div>
    </header>

    <main class="full-height-custom p-6">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
